<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campus Lost & Found — Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/normalize.css/normalize.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f9f9f9;
    }
    h1 {
      color: #2c3e50;
      text-align: center;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    input, textarea, select, button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      font-size: 14px;
    }
    button {
      background: #3498db;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #2980b9;
    }
    .items {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }
    .item {
      background: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .item img {
      max-width: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Campus Lost & Found</h1>
  
  <form id="lostFoundForm">
    <select id="type">
      <option value="lost">Lost</option>
      <option value="found">Found</option>
    </select>
    <input type="text" id="itemName" placeholder="Item name" required />
    <textarea id="itemDescription" placeholder="Description" required></textarea>
    <input type="file" id="itemImage" accept="image/*" required />
    <input type="text" id="contactInfo" placeholder="Your contact info" required />
    <button type="submit">Submit</button>
  </form>
  
  <div class="items" id="itemsContainer"></div>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
  
  <script>
    // 🔥 Your Firebase config
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyA6nAAc3sx9mkOapNSff7k1EFGkfbLN_o4",
      authDomain: "smart-bin-b826f.firebaseapp.com",
      databaseURL: "https://smart-bin-b826f-default-rtdb.firebaseio.com",
      projectId: "smart-bin-b826f",
      storageBucket: "smart-bin-b826f.appspot.com",
      messagingSenderId: "339092553035",
      appId: "1:339092553035:web:9edfd5351f64d6cb563cce",
      measurementId: "G-HN2LD86VWN"
    };

    // Initialize Firebase
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();
    const storage = firebase.storage();

    // 📌 Image compression before upload
    function compressImage(file, maxWidth, maxHeight, callback) {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxWidth) {
              height *= maxWidth / width;
              width = maxWidth;
            }
          } else {
            if (height > maxHeight) {
              width *= maxHeight / height;
              height = maxHeight;
            }
          }

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          canvas.toBlob((blob) => {
            callback(blob);
          }, "image/jpeg", 0.7); // 70% quality
        };
      };
    }

    // 📌 Handle form submit
    document.getElementById("lostFoundForm").addEventListener("submit", function(e) {
      e.preventDefault();
      
      const type = document.getElementById("type").value;
      const itemName = document.getElementById("itemName").value;
      const itemDescription = document.getElementById("itemDescription").value;
      const itemImage = document.getElementById("itemImage").files[0];
      const contactInfo = document.getElementById("contactInfo").value;

      if (!itemImage) return alert("Please select an image.");

      // Compress before uploading
      compressImage(itemImage, 800, 800, (compressedBlob) => {
        const fileName = Date.now() + '-' + itemImage.name;
        const storageRef = storage.ref("lost_found/" + fileName);

        storageRef.put(compressedBlob).then(snapshot => {
          return snapshot.ref.getDownloadURL();
        }).then(downloadURL => {
          const newItemRef = db.ref("lost_found_items").push();
          newItemRef.set({
            type,
            name: itemName,
            description: itemDescription,
            imageUrl: downloadURL,
            contact: contactInfo,
            timestamp: Date.now()
          });
          document.getElementById("lostFoundForm").reset();
        }).catch(error => {
          console.error("Upload failed:", error);
        });
      });
    });

    // 📌 Display items in real-time
    const itemsContainer = document.getElementById("itemsContainer");
    db.ref("lost_found_items").on("value", (snapshot) => {
      itemsContainer.innerHTML = "";
      snapshot.forEach((childSnapshot) => {
        const item = childSnapshot.val();
        const div = document.createElement("div");
        div.classList.add("item");
        div.innerHTML = `
          <h3>${item.type.toUpperCase()}: ${item.name}</h3>
          <img src="${item.imageUrl}" alt="${item.name}" />
          <p>${item.description}</p>
          <p><b>Contact:</b> ${item.contact}</p>
        `;
        itemsContainer.appendChild(div);
      });
    });
  </script>
</body>
</html>
